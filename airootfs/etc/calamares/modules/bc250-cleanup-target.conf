# ============================================================
# Calamares - BC-250 Gaming - limpeza do sistema instalado
# ============================================================
# Executado dentro do chroot do destino, logo após o unpackfs e
# antes de initcpiocfg/initcpio (o mkinitcpio precisa do kernel em
# /boot e não pode ver o /etc/mkinitcpio.conf.d/archiso.conf).
---
dontChroot: false
timeout: 1800
script:
    - "/usr/local/bin/bc250-cleanup-target"
