# ============================================================
# Calamares - BC-250 Gaming - configuração do GRUB
# ============================================================
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params:
    - "nowatchdog"
    - "nvme_load=YES"
defaults:
    GRUB_TIMEOUT: 5
    GRUB_TOP_LEVEL: "/boot/vmlinuz-linux-cachyos-bc250"
    GRUB_DISABLE_SUBMENU: false
    GRUB_DISABLE_OS_PROBER: false
    GRUB_DISABLE_RECOVERY: true
    GRUB_THEME: ""
    GRUB_EARLY_INITRD_LINUX_STOCK: ""
always_use_defaults: true
