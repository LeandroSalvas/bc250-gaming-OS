# ============================================================
# Calamares - BC-250 Gaming - serviços do sistema instalado
# ============================================================
---
units:
    - name: "NetworkManager"
      action: "enable"
      mandatory: true

    - name: "bluetooth"
      action: "enable"
      mandatory: false

    - name: "systemd-resolved"
      action: "enable"
      mandatory: false

    - name: "systemd-timesyncd"
      action: "enable"
      mandatory: false

    - name: "fstrim.timer"
      action: "enable"
      mandatory: false

    - name: "bc250-load-modules"
      action: "enable"
      mandatory: false

    - name: "pacman-init"
      action: "disable"
      mandatory: false
