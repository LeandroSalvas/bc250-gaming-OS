# ============================================================
# Calamares - BC-250 Gaming - instalação offline via UnpackFS
# ============================================================
# Copia o SquashFS pristine do Live (lowerdir read-only) para o
# destino. Usamos /run/archiso/airootfs (e não bootmnt) porque ele
# continua montado mesmo quando copytoram=auto desmonta bootmnt.
#
# O rsync do UnpackFS copia o sistema já instalado (banco do pacman,
# kernel em /usr/lib/modules etc.), sem usuário live, autologin ou
# regras de sudoers do ambiente Live. O script bc250-cleanup-target
# remove os artefatos restantes e prepara o destino para o boot.
---
unpack:
    -   source: "/run/archiso/airootfs"
        sourcefs: "file"
        destination: ""
