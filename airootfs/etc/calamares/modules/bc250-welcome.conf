# ============================================================
# Calamares - BC-250 Gaming - página de boas-vindas (offline)
# ============================================================
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    # O sistema descompactado ocupa ~8-10 GiB; deixamos margem de segurança.
    requiredStorage:    12.0
    requiredRam:        2.0

    # Instalação totalmente offline: não exigir internet.
    check:
        - storage
        - ram
    required:
        - storage
        - ram
