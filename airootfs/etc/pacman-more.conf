#
# /etc/pacman-more.conf
# Usado pelo instalador Calamares (CachyOS) durante a instalação ONLINE:
# é copiado para /etc/pacman.conf do sistema de destino antes do pacstrap.
#
[options]
HoldPkg     = pacman glibc
Architecture = x86_64 x86_64_v2 x86_64_v3
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Repositório comunitário BC-250 (kernel/proton/fixes)
[bc250-cachyos]
SigLevel = Optional TrustAll
Server = https://github.com/MastaG/linux-cachyos-bc250/releases/download/repo

# Repositórios CachyOS otimizados (x86-64-v3)
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Repositórios Arch Linux
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
