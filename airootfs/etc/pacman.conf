#
# /etc/pacman.conf do sistema Live/instalado BC-250
# (sem repositório local de build)
#

[options]
HoldPkg     = pacman glibc
# Zen2 (BC-250) suporta até x86-64-v3. Listar explicitamente garante que os
# repositórios otimizados da CachyOS sejam usados mesmo sem o pacman patched.
Architecture = x86_64 x86_64_v2 x86_64_v3
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[bc250-cachyos]
SigLevel = Optional TrustAll
Server = https://github.com/MastaG/linux-cachyos-bc250/releases/download/repo

[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
