#
# /etc/pacman.conf para build do BC-250 Gaming ISO
# Repositórios: bc250-cachyos + CachyOS + Arch (core/extra/multilib)
#

[options]
HoldPkg     = pacman glibc
# Zen2 (BC-250) suporta até x86-64-v3. Listar explicitamente garante que os
# repositórios otimizados da CachyOS sejam usados mesmo sem o pacman patched.
Architecture = x86_64 x86_64_v2 x86_64_v3
CheckSpace
ParallelDownloads = 5
# Verificação de assinatura desativada APENAS neste pacman.conf de build.
# O keyring do chroot é criado/populado no boot do Live (pacman-init.service).
# O sistema instalado usa airootfs/etc/pacman.conf com SigLevel = Required.
SigLevel    = Never
LocalFileSigLevel = Optional

#
# REPOSITÓRIOS
#

# Repositório oficial da comunidade BC-250 (MastaG)
# Contém proton-cachyos-native-bc250, bc250-cec, bc250-fixes, etc.
[bc250-cachyos]
SigLevel = Optional TrustAll
Server = https://github.com/MastaG/linux-cachyos-bc250/releases/download/repo

# Repositórios CachyOS (kernel BC-250, sddm, pacotes otimizados)
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Repositórios Arch Linux
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
