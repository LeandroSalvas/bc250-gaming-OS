# ============================================================
# Calamares - BC-250 Gaming
# Instalação OFFLINE: copia o SquashFS do Live via UnpackFS.
# Configs customizadas em /etc/calamares/modules/bc250-*.conf
# (nomes únicos para não colidir com as do pacote cachyos-calamares).
# ============================================================
---
modules-search: [ local ]

instances:

# --- Páginas com configuração própria ---
- id:       bc250_welcome
  module:   welcome
  config:   bc250-welcome.conf

- id:       bc250_partition
  module:   partition
  config:   bc250-partition.conf

# --- Execução ---
- id:       bc250_unpackfs
  module:   unpackfs
  config:   bc250-unpackfs.conf

- id:       bc250_cleanup
  module:   shellprocess
  config:   bc250-cleanup-target.conf

- id:       bc250_displaymanager
  module:   displaymanager
  config:   bc250-displaymanager.conf

- id:       bc250_grubcfg
  module:   grubcfg
  config:   bc250-grubcfg.conf

- id:       bc250_bootloader
  module:   bootloader
  config:   bc250-bootloader.conf

- id:       bc250_services
  module:   services-systemd
  config:   bc250-services-systemd.conf

sequence:
- show:
  - welcome@bc250_welcome
  - locale
  - keyboard
  - partition@bc250_partition
  - users
  - summary
- exec:
  - partition@bc250_partition
  - mount
  - unpackfs@bc250_unpackfs
  - shellprocess@bc250_cleanup
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - luksbootkeyfile
  - luksopenswaphookcfg
  - initcpiocfg
  - initcpio
  - users
  - displaymanager@bc250_displaymanager
  - hwclock
  - grubcfg@bc250_grubcfg
  - bootloader@bc250_bootloader
  - services-systemd@bc250_services
  - umount
- show:
  - finished

branding: cachyos

prompt-install: true

dont-chroot: false

oem-setup: false

disable-cancel: false

disable-cancel-during-exec: false

hide-back-and-next-during-exec: true

quit-at-end: false
